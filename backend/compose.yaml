name: mhg-core
x-db-env: &db-env
  DATABASE_URL: ${DATABASE_URL:-}
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-mhg}
  DB_USER: ${DB_USER:-mhg}
  DB_PASSWORD: ${DB_PASSWORD:-}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}

services:
  db:
    image: postgres:17.11-bookworm@sha256:04ea508c0ea323b679fbab075463b800b33337253768ad3feccfbc8005c644aa
    environment:
      POSTGRES_DB: ${DB_NAME:-mhg}
      POSTGRES_USER: ${DB_USER:-mhg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: base
    environment: *db-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: base
    environment:
      <<: *db-env
      ENVIRONMENT: ${ENVIRONMENT:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_NAME: ${COOKIE_NAME:-mhg_session}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-[]}
      PUBLIC_RATE_LIMIT_ENABLED: ${PUBLIC_RATE_LIMIT_ENABLED:-true}
      PUBLIC_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:-900}
      PUBLIC_RATE_LIMIT_KITCHEN_SUBMISSIONS: ${PUBLIC_RATE_LIMIT_KITCHEN_SUBMISSIONS:-10}
      PUBLIC_RATE_LIMIT_LEADS: ${PUBLIC_RATE_LIMIT_LEADS:-20}
      PUBLIC_RATE_LIMIT_APPOINTMENTS: ${PUBLIC_RATE_LIMIT_APPOINTMENTS:-10}
      PUBLIC_RATE_LIMIT_KITCHEN_CONFIGURATIONS: ${PUBLIC_RATE_LIMIT_KITCHEN_CONFIGURATIONS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
      STAGING_EMAIL_OVERRIDE: ${STAGING_EMAIL_OVERRIDE:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  test-db:
    profiles: ["test"]
    image: postgres:17.11-bookworm@sha256:04ea508c0ea323b679fbab075463b800b33337253768ad3feccfbc8005c644aa
    environment:
      POSTGRES_DB: mhg_test
      POSTGRES_USER: mhg_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhg_test -d mhg_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      ENVIRONMENT: test
      DB_HOST: test-db
      DB_PORT: 5432
      DB_NAME: mhg_test
      DB_USER: mhg_test
      DB_PASSWORD: test-only-password
      DB_SSLMODE: disable
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres-data:
