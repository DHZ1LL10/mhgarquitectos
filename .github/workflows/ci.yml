name: CI

on:
  pull_request:
  push:
    branches: [main, phase-4a-staging-hardening, phase-4b-local-release-candidate, phase-4e-admin-crm]

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_tracked_secrets.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: mhg_test
          POSTGRES_USER: mhg_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mhg_test -d mhg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: mhg_test
      DB_USER: mhg_test
      DB_PASSWORD: test-only-password
      DB_SSLMODE: disable
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff check app migrations tests
      - run: python -m ruff format --check app migrations tests
      - run: python -m compileall -q app migrations tests
      - run: python -m pytest tests/test_contracts.py
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest tests/integration
      - run: docker build --target base -t mhg-backend-ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DEPLOYMENT_ENV: local
      SITE_URL: http://localhost:3000
      PROPERTY_REPOSITORY: local
      PROPERTY_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      CUSTOMIZER_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify:legacy
      - run: npm run build
      - run: npm run verify:routes

  required:
    if: always()
    needs: [repository-security, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.repository-security.result }}" = success
      - run: test "${{ needs.backend.result }}" = success
      - run: test "${{ needs.frontend.result }}" = success
